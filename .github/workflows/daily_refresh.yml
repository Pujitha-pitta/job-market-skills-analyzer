# Daily refresh: downloads today's live Swedish job ads, reloads Snowflake and
# runs dbt build (all models + tests) — every morning, or on demand from the
# Actions tab ("Run workflow").
#
# Needs three repository secrets (Settings -> Secrets and variables -> Actions):
#   SNOWFLAKE_ACCOUNT    e.g. ORGNAME-ACCOUNTNAME
#   SNOWFLAKE_USER       your Snowflake login name
#   SNOWFLAKE_PASSWORD   a Programmatic Access Token (recommended) or password
name: Daily refresh

on:
  schedule:
    - cron: "0 5 * * *"        # 05:00 UTC = 06:00/07:00 in Sweden
  workflow_dispatch:

permissions:
  contents: read
  pages: write       # publish the dbt docs site to GitHub Pages
  id-token: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run pipeline (sample data + real JobTech ads -> Snowflake -> dbt build)
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          DBT_ENGINE_MANAGE_STATE: "false"
        run: python run_pipeline.py

      - name: Build dbt docs site (models, tests, lineage graph)
        working-directory: dbt_project
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          DBT_ENGINE_MANAGE_STATE: "false"
        run: |
          python run_dbt.py docs generate --static
          mkdir -p ../site/dbt-docs
          cp ../pages/index.html ../site/index.html                 # home -> live Streamlit dashboard
          cp target/static_index.html ../site/dbt-docs/index.html   # dbt docs at /dbt-docs/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-docs:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
